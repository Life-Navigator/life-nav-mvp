name: Fly Apps CI/CD

# Per-app CI (test/check) + CD (deploy) for the three Fly.io apps. Each app's jobs run ONLY when that app's
# files change (path filter), so a web-only change doesn't rebuild the backend and vice-versa. Deploy runs
# only on a push to main, only for the app that changed, and only after its tests pass.
#
# SECRETS ARE SYNCED FROM GITHUB, NOT SET BY HAND ON FLY.
# Each deploy job stages that app's secrets from the `secrets.*` context via scripts/ci/fly_secrets.sh,
# then deploys — so the staged values and the image ship in ONE release. GitHub is the single source of
# truth; `flyctl secrets set` by hand drifts silently and is invisible to review.
#
# The script holds a per-app manifest and refuses to deploy when a required secret is unset or EMPTY (an
# unset GitHub secret expands to an empty string, which would otherwise deploy an app that cannot reach
# its stores and fails later as "no results"). The manifests are also least-privilege: api-gateway does
# NOT receive SUPABASE_SERVICE_ROLE_KEY — see GATEWAY_PRIVILEGE_REDUCTION.md.
#
# Required repo secret for deployment itself: FLY_API_TOKEN (flyctl tokens create org).
# The full inventory, and which service needs which value, is in docs/deploy/SECRETS.md.
#
# Web deploys via Vercel's own Git integration; Supabase migrations/edge functions via supabase.yml.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: fly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Detect which Fly app(s) changed ────────────────────────────────────────
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      core_api: ${{ steps.f.outputs.core_api }}
      api_gateway: ${{ steps.f.outputs.api_gateway }}
      ingestion_worker: ${{ steps.f.outputs.ingestion_worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            core_api:
              - 'apps/lifenavigator-core-api/**'
            api_gateway:
              - 'apps/api-gateway/**'
            ingestion_worker:
              - 'apps/ingestion-worker/**'
              # The generated ontology manifest lives in core-api (it ships in that image) but is OWNED
              # by the worker's registry, and the Rust test `manifest_on_disk_matches_the_registry` is
              # what enforces they agree. Without this line, hand-editing the manifest would skip the
              # only check that can catch it — the exact drift this contract exists to prevent.
              - 'apps/lifenavigator-core-api/app/grounding/semantic/ontology_manifest.json'

  # ── CI: core-api (FastAPI) pytest ──────────────────────────────────────────
  test-core-api:
    name: Test core-api
    needs: changes
    if: ${{ needs.changes.outputs.core_api == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lifenavigator-core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/lifenavigator-core-api/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  # ── CI: api-gateway pytest ─────────────────────────────────────────────────
  test-api-gateway:
    name: Test api-gateway
    needs: changes
    if: ${{ needs.changes.outputs.api_gateway == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api-gateway/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  # ── CI: ingestion-worker (Rust) compile check ──────────────────────────────
  check-ingestion-worker:
    name: Check ingestion-worker
    needs: changes
    if: ${{ needs.changes.outputs.ingestion_worker == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ingestion-worker
    steps:
      - uses: actions/checkout@v4
      # Pinned to an immutable SHA (B-19). NOTE: for this action the branch name doubles as the
      # toolchain selector, so `toolchain:` must now be passed explicitly to preserve behaviour.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/ingestion-worker
      - run: cargo check --all-targets

  # ── CD: deploy each changed app to Fly (main only, after its tests pass) ────
  deploy-core-api:
    name: Deploy core-api
    needs: [changes, test-core-api]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.core_api == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-core-api
      cancel-in-progress: false
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
      PLAID_CLIENT_SECRET: ${{ secrets.PLAID_CLIENT_SECRET }}
      PLAID_ENV: ${{ vars.PLAID_ENV }}
      # Retrieval flags come from repo VARIABLES, not secrets — they are configuration, they are not
      # sensitive, and they must be visible to whoever is reading why production behaves as it does.
      GRAPH_GROUNDING_ENABLED: ${{ vars.GRAPH_GROUNDING_ENABLED }}
      GRAPH_RETRIEVAL_V2: ${{ vars.GRAPH_RETRIEVAL_V2 }}
      MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
      VERTEX_PROJECT: ${{ vars.VERTEX_PROJECT }}
      VERTEX_REGION: ${{ vars.VERTEX_REGION }}
      PRIVATE_BETA_ENABLED: ${{ vars.PRIVATE_BETA_ENABLED }}
      PRIVATE_BETA_ALLOWLIST: ${{ secrets.PRIVATE_BETA_ALLOWLIST }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
    steps:
      - uses: actions/checkout@v4
      # Pinned to an immutable SHA (B-19); `@master` was a mutable ref on a deploy path.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      - name: Stage secrets from GitHub
        run: ./scripts/ci/fly_secrets.sh core-api
      - run: flyctl deploy --remote-only
        working-directory: apps/lifenavigator-core-api

  deploy-api-gateway:
    name: Deploy api-gateway
    needs: [changes, test-api-gateway]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.api_gateway == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-api-gateway
      cancel-in-progress: false
    environment: production
    # DELIBERATELY SHORT. This service verifies Supabase-issued JWTs and queries the stores; it never
    # calls Supabase, so it gets the JWT secret and nothing else from that provider. SUPABASE_URL /
    # ANON_KEY / SERVICE_ROLE_KEY were removed after an audit found zero read sites
    # (GATEWAY_PRIVILEGE_REDUCTION.md). Adding them back here would silently re-grant an RLS bypass.
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      # Pinned to an immutable SHA (B-19); `@master` was a mutable ref on a deploy path.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      - name: Stage secrets from GitHub
        run: ./scripts/ci/fly_secrets.sh api-gateway
      - run: flyctl deploy --remote-only
        working-directory: apps/api-gateway

  deploy-ingestion-worker:
    name: Deploy ingestion-worker
    needs: [changes, check-ingestion-worker]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.ingestion_worker == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ingestion-worker
      cancel-in-progress: false
    environment: production
    # The worker is the one service that legitimately holds the service-role key AND write access to all
    # three stores — it IS the ingestion path. It verifies no user tokens, so it needs no JWT secret.
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      WORKER_BATCH_SIZE: ${{ vars.WORKER_BATCH_SIZE }}
      WORKER_MAX_RETRIES: ${{ vars.WORKER_MAX_RETRIES }}
      WORKER_POLL_INTERVAL_SECONDS: ${{ vars.WORKER_POLL_INTERVAL_SECONDS }}
    steps:
      - uses: actions/checkout@v4
      # Pinned to an immutable SHA (B-19); `@master` was a mutable ref on a deploy path.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      - name: Stage secrets from GitHub
        run: ./scripts/ci/fly_secrets.sh ingestion-worker
      - run: flyctl deploy --remote-only
        working-directory: apps/ingestion-worker

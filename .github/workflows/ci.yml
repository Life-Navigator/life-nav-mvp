name: CI

on:
  push:
    branches: [main, mvp]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ── Quality Gates (parallel) ────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm turbo lint --filter=@life-navigator/web

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm turbo type-check --filter=@life-navigator/web --filter=@life-navigator/supabase --filter=@life-navigator/ui-components

  # ── Sprint T: Governance enforcement gate ───────────────────────────
  # Static check that no AI-output-producing route can ship without
  # runtime governance. See apps/web/scripts/verify-governance.ts.
  # A failure here means a route was added or modified that emits
  # LLM-generated text without going through createGovernedHandler,
  # guardOutgoing, or reviewAndPersist.
  verify-governance:
    name: Verify Governance Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm --filter @life-navigator/web run verify:governance

  # ── Unit Tests ──────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm

      - name: Run unit tests with coverage
        run: pnpm turbo test --filter=@life-navigator/web -- --ci --coverage --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: ./apps/web/test-results
          JEST_JUNIT_OUTPUT_NAME: junit.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: apps/web/test-results/
          retention-days: 14

  # ── Build ───────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, verify-governance]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm

      - name: Build web app
        run: pnpm turbo build --filter=@life-navigator/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next/
          retention-days: 7

      - name: Report bundle size
        if: github.event_name == 'pull_request'
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f apps/web/.next/build-manifest.json ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            du -sh apps/web/.next/ | awk '{print "Total build: " $1}'  >> $GITHUB_STEP_SUMMARY
            du -sh apps/web/.next/static/ 2>/dev/null | awk '{print "Static assets: " $1}' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ── E2E Tests ───────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    # Only run on PRs to main or pushes to main (skip on mvp to save CI minutes)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/.next/

      - name: Run E2E tests
        run: pnpm exec playwright test --project=chromium
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 14

  # ── Ontology Validation ────────────────────────────────────────────
  # (The graphrag-pipeline py_compile step was removed with that app — it's superseded by the Rust
  #  ingestion-worker. The ontology TTL files it consumed are still validated here.)
  # ── Architectural Invariants ────────────────────────────────────────
  # Deliberately UNCONDITIONAL — no paths-filter. These are global properties of the system, not
  # per-app concerns: an invariant that only runs when one directory changes is not an invariant.
  # A cross-tenant leak can be introduced by a change that never touches core-api's test paths.
  #
  # Invariants enforced (docs/semantic-platform/implementation/IMPLEMENTATION_DECISION_AUDIT.md):
  #   I-1  the Rust ingestion worker is the ONLY graph writer
  #   I-2  the Python Neo4j client is read-only
  #   I-3  every traversal node pattern binds tenant_id — both endpoints
  #   I-4  a caller cannot override the bound tenant
  #   I-10 relationship types come from the generated catalog, never raw string literals
  #
  # Every one of these is proven to FAIL on a deliberately broken input; see
  # docs/semantic-platform/implementation/INVARIANT_TEST_RESULTS.md.
  architectural-invariants:
    name: Architectural Invariants
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lifenavigator-core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/lifenavigator-core-api/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Enforce architectural invariants
        run: python -m pytest tests/test_architectural_invariants.py -q

  validate-ontology:
    name: Validate Ontology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify ontology files exist
        run: |
          for f in core/person.ttl core/document.ttl core/cross-domain.ttl health/condition.ttl career/profile.ttl career/job.ttl education/credentials.ttl education/institutions.ttl finance/accounts.ttl finance/instruments.ttl finance/strategies.ttl goals/goal.ttl; do
            if [ ! -f "ontology/$f" ]; then
              echo "::error::Missing ontology file: ontology/$f"
              exit 1
            fi
          done
          echo "All 12 ontology files present"

  # ── Security ────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # TruffleHog verified-only pass: high-confidence, provider-verified secrets (AWS, GitHub, Stripe…).
      # Kept because its false-positive rate is ~0.
      - name: TruffleHog (verified secrets)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      # Gitleaks pass — added after the 2026-07-28 incident (CREDENTIAL_INCIDENT_REPORT.md).
      #
      # The TruffleHog step above ran on every commit for months and never flagged the credential that
      # leaked, because `--only-verified` reports a secret ONLY if it can be verified against a provider
      # API. A generic application password for our OWN Supabase project has no provider verifier, so it
      # was invisible to that scan by design. The control worked as configured and still missed a live
      # production credential for ~30 days.
      #
      # Gitleaks needs no verification step and carries project-specific rules (.gitleaks.toml) targeting
      # the exact shape that leaked: a hardcoded fallback to an env-var lookup.
      # Installed as a BINARY, not via gitleaks/gitleaks-action@v2.
      #
      # That action refuses to run for GitHub *organizations* without a paid licence key, and it had
      # been failing closed with "missing gitleaks license" on every run since it was added — so the
      # control the incident response introduced never actually executed once. The scanner itself is
      # free; only the Action wrapper is licensed. Running the binary removes the dependency entirely.
      - name: Install gitleaks
        run: |
          VER=8.28.0
          curl -sSL -o /tmp/gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version

      # The working tree must be clean, always. This is the check that matters: it is what stops a
      # credential from being added.
      - name: Gitleaks (working tree)
        run: gitleaks detect --config .gitleaks.toml --no-git --redact --no-banner

      # Newly introduced commits are scanned as well, so a secret that is added and then deleted in a
      # later commit of the same PR is still caught.
      #
      # NOT a full-history scan. History currently holds 87 findings, dominated by the two rotated/
      # pending-rotation incident credentials (CREDENTIAL_INCIDENT_REPORT.md). Gating on those would
      # mean a permanently red required check, and a permanently red check is one people learn to
      # merge past — the precise failure mode that let both credentials survive. History is addressed
      # by ROTATION, which makes the values inert; this gate is about what is being added now.
      - name: Gitleaks (commits in this PR)
        if: github.event_name == 'pull_request'
        run: |
          gitleaks detect --config .gitleaks.toml --redact --no-banner \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      # CANARY — proves the scanner above actually detects secrets, rather than merely exiting 0.
      #
      # Both credential incidents happened while a secret-scanning job passed on every commit. A green
      # check is equally consistent with "no secrets present" and "scanner broken, misconfigured, or
      # pointed at the wrong ruleset", and nothing here could tell those apart. This step plants fake
      # credentials shaped like the two that actually leaked and fails the build if any goes undetected.
      #
      # It runs AFTER the scan deliberately: if an allowlist entry is widened until it swallows a real
      # rule, this is what catches it. It already has — the first run found that
      # `assigned-credential-literal` missed `SUPABASE_SERVICE_KEY = "..."`, the service-role shape that
      # bypasses RLS.
      #
      # If this fails, fix the rule. Do not weaken the canary.
      - name: Secret-scanner canary (control must detect the threat)
        run: ./scripts/security/gitleaks_canary.sh

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm

      - name: Audit for known vulnerabilities
        run: pnpm audit --prod --audit-level=high || true
        # "|| true" allows CI to continue — vulnerability counts are reported
        # but won't block deploys for dev-only deps. Critical vulns in prod
        # deps should be addressed in the security-audit scheduled workflow.

      - name: Check for outdated dependencies
        if: github.event_name == 'pull_request'
        run: |
          echo "## Dependency Health" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pnpm outdated 2>&1 | head -40 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ── Database Migration Validation ──────────────────────────────────
  validate-migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SQL migration files
        run: |
          echo "## Migration Validation" >> $GITHUB_STEP_SUMMARY
          MIGRATION_DIR="supabase/migrations"
          if [ -d "$MIGRATION_DIR" ]; then
            FILE_COUNT=$(ls -1 "$MIGRATION_DIR"/*.sql 2>/dev/null | wc -l)
            echo "Found $FILE_COUNT migration files" >> $GITHUB_STEP_SUMMARY
            # Check for syntax issues in SQL files (basic validation)
            for f in "$MIGRATION_DIR"/*.sql; do
              if [ -f "$f" ]; then
                # Check for common SQL issues
                if grep -qiP '(DROP\s+DATABASE|DROP\s+SCHEMA\s+public)' "$f"; then
                  echo "::error file=$f::Dangerous SQL detected: DROP DATABASE or DROP SCHEMA public"
                  exit 1
                fi
              fi
            done
            echo "All migrations passed basic validation" >> $GITHUB_STEP_SUMMARY
          else
            echo "No migrations directory found" >> $GITHUB_STEP_SUMMARY
          fi

  # ── Deploy (main branch only) ──────────────────────────────────────
  deploy-edge-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, unit-tests, secrets-scan, validate-ontology]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Edge-function secrets, synced from GitHub BEFORE the functions that need them are deployed.
      #
      # These functions have been deploying without their secrets ever being set. A Deno function reading
      # an unset env var gets `undefined`, so `graphrag-sync` and `process-ingestion` deploy green and
      # then fail at runtime on their first store call — the same silent-empty-config failure the Fly
      # manifest guards against, in the one tier that had no guard at all.
      - name: Sync Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING=()
          for n in GEMINI_API_KEY QDRANT_URL QDRANT_API_KEY NEO4J_URI NEO4J_USERNAME NEO4J_PASSWORD; do
            [ -n "${!n:-}" ] || MISSING+=("$n")
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Edge function secrets unset: ${MISSING[*]}"
            exit 1
          fi
          # Values are piped via an env file on stdin-equivalent; never echoed, never in argv.
          umask 077
          ENVFILE="$(mktemp)"
          trap 'rm -f "$ENVFILE"' EXIT
          {
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'QDRANT_URL=%s\n' "$QDRANT_URL"
            printf 'QDRANT_API_KEY=%s\n' "$QDRANT_API_KEY"
            printf 'NEO4J_URI=%s\n' "$NEO4J_URI"
            printf 'NEO4J_USERNAME=%s\n' "$NEO4J_USERNAME"
            printf 'NEO4J_PASSWORD=%s\n' "$NEO4J_PASSWORD"
          } > "$ENVFILE"
          supabase secrets set --env-file "$ENVFILE" --project-ref "$PROJECT_REF"
          echo "synced 6 edge-function secrets"

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy graphrag-sync --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy graphrag-query --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy email-sync --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy calendar-sync --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy process-ingestion --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ── Database migrations (main only, after validation) ──────────────
  # Migrations were VALIDATED here but never APPLIED, so every schema change needed someone to remember
  # to run `supabase db push` by hand. That is why "migration NOT yet applied" has blocked so many
  # features — the pipeline reported success for a deploy whose schema had not shipped.
  #
  # Gated on `environment: production`, so a required reviewer can be attached in repo settings if
  # unattended schema changes ever stop being acceptable. `--linked` targets the project the
  # SUPABASE_PROJECT_REF secret names; it does not read any connection string from the repo.
  deploy-migrations:
    name: Apply Database Migrations
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [validate-migrations, unit-tests, secrets-scan]
    environment: production
    concurrency:
      group: supabase-migrations
      cancel-in-progress: false # never interrupt a migration mid-apply
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Show pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "## Pending migrations" >> $GITHUB_STEP_SUMMARY
          supabase migration list --linked >> $GITHUB_STEP_SUMMARY 2>&1 || true
      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked

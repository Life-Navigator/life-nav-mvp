# LifeNavigator Core API — Fly.io app definition.
#
# The orchestration tier. Holds Supabase/Gemini/Qdrant/Neo4j credentials
# server-side ONLY. The Vercel frontend never holds a Gemini key
# (ARCHITECTURE_BOUNDARIES.md).
#
#   fly apps create lifenavigator-core-api
#   fly secrets set \
#     SUPABASE_URL=... SUPABASE_ANON_KEY=... SUPABASE_JWT_SECRET=... \
#     SUPABASE_SERVICE_ROLE_KEY=... \
#     GEMINI_API_KEY=... \
#     QDRANT_URL=... QDRANT_API_KEY=... \
#     QDRANT_PERSONAL_COLLECTION=life_navigator QDRANT_CENTRAL_COLLECTION=ln_central \
#     NEO4J_URI=... NEO4J_USERNAME=... NEO4J_PASSWORD=... \
#     NEO4J_PERSONAL_DATABASE=... ALLOWED_ORIGINS=https://lifenavigator.tech
#   fly deploy
#
# (Reuse the same secret values already present on lifenavigator-api-gateway.)

app = "lifenavigator-core-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  LOG_LEVEL = "info"
  GEMINI_EMBEDDING_MODEL = "gemini-embedding-001"   # 3072-dim; MUST match the worker
  GEMINI_GENERATION_MODEL = "gemini-2.5-flash"

  # ── Semantic GraphRAG (Phase 5A: core-api is the authoritative owner) ──────────────────────────
  # GRAPH_GROUNDING_ENABLED turns retrieval on at all; GRAPH_RETRIEVAL_V2 selects the semantic engine
  # (planning → entity linking → bounded typed traversal → RRF fusion over personal+central → feature
  # reranking) over the legacy flat retriever, which stays in-tree purely as the rollback path.
  #
  # Left OFF here deliberately: enabling it changes what reaches the model on every advisor turn, and
  # the honest gate for that is a measured win on the retrieval eval set, not a config edit. Flip it in
  # staging first — `flyctl secrets set GRAPH_GROUNDING_ENABLED=true -a lifenavigator-core-api` — read
  # the per-turn `graphrag` trace lines, then promote.
  #
  # Rollback is a flag, not a deploy: GRAPH_RETRIEVAL_V2=false reverts to the previous behaviour, and
  # GRAPH_GROUNDING_ENABLED=false removes graph evidence from the turn entirely.
  GRAPH_GROUNDING_ENABLED = "false"
  GRAPH_RETRIEVAL_V2 = "true"

  # Store bindings the engine needs. Secrets (QDRANT_API_KEY, NEO4J_PASSWORD, GEMINI_API_KEY) are set
  # via `flyctl secrets set`, never here.
  QDRANT_PERSONAL_COLLECTION = "life_navigator"
  QDRANT_CENTRAL_COLLECTION = "ln_central"
  NEO4J_PERSONAL_DATABASE = "neo4j"
  NEO4J_CENTRAL_DATABASE = "central"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "get"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
